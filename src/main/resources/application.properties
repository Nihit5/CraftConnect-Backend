spring.application.name=craft-connect

spring.datasource.url=jdbc:mysql://localhost:3306/craft_connect?autoReconnect=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

upload-dir=${user.home}/craft-connect/uploads

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.nihit.craft_connect.entity
mybatis.configuration.map-underscore-to-camel-case=true


